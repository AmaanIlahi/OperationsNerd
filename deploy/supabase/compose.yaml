      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Run prepare.py first}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Run prepare.py first}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run prepare.py first}
      REALTIME_DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?Run prepare.py first}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:?Run prepare.py first}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Run prepare.py first}
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:?Run prepare.py first}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:?Run prepare.py
        first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run prepare.py first}
      APP_ORIGIN: ${APP_ORIGIN:?Run prepare.py first}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Run prepare.py first}
      APP_DB_NAME: opsnerd_control
      APP_ALLOW_DATABASE_CREATE: 'true'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  storage:
    build:
      context: ../..
      dockerfile: deploy/supabase/images/storage.Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py first}
      JWT_SECRET: ${JWT_SECRET:?Run prepare.py first}
      ANON_KEY: ${ANON_KEY:?Run prepare.py first}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Run prepare.py first}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Run prepare.py first}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Run prepare.py first}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run prepare.py first}
      REALTIME_DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?Run prepare.py first}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:?Run prepare.py first}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Run prepare.py first}
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:?Run prepare.py first}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:?Run prepare.py
        first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run prepare.py first}
      APP_ORIGIN: ${APP_ORIGIN:?Run prepare.py first}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Run prepare.py first}
      APP_DB_NAME: opsnerd_control
      APP_ALLOW_DATABASE_CREATE: 'true'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - storage:/var/lib/storage
  meta:
    build:
      context: ../..
      dockerfile: deploy/supabase/images/meta.Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py first}
      JWT_SECRET: ${JWT_SECRET:?Run prepare.py first}
      ANON_KEY: ${ANON_KEY:?Run prepare.py first}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Run prepare.py first}
