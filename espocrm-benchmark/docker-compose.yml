services:
  espocrm-db:
    image: mariadb:11.4
    container_name: espocrm-db
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD:?set ESPOCRM_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD:?set ESPOCRM_DB_PASSWORD in .env}
    volumes:
      - espocrm-db:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

  espocrm:
    image: espocrm/espocrm:9.0.4
    container_name: espocrm
    depends_on:
      espocrm-db:
        condition: service_healthy
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD:?set ESPOCRM_DB_PASSWORD in .env}
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?set ESPOCRM_ADMIN_PASSWORD in .env}
      ESPOCRM_SITE_URL: "http://localhost:8080"
    volumes:
      - espocrm-data:/var/www/html/data
      - ./custom:/var/www/html/custom
      - ./client-custom:/var/www/html/client/custom
    ports:
      - "127.0.0.1:8080:80"
    restart: always

volumes:
  espocrm-db:
  espocrm-data: