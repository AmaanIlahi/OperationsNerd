entities:
  - entity_type: crm_employee
    label: Employee
    fields: [first_name, last_name, email, role, department, manager, start_date, pto_balance_days]
    required: [first_name]

  - entity_type: crm_candidate
    label: Candidate
    fields: [name, email, phone, role_applied, stage, resume_ref]
    required: [name]
